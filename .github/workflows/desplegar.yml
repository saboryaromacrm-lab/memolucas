name: Desplegar en el VPS

# Con cada push a main, entra por SSH al VPS y corre scripts/desplegar.sh.
# Necesita estos secretos en GitHub (Settings → Secrets and variables → Actions):
#   VPS_HOST, VPS_USER, VPS_SSH_KEY y opcionalmente VPS_PORT (22 por defecto).
# Si no están cargados, el paso se saltea sin fallar.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desplegar
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    env:
      TIENE_VPS: ${{ secrets.VPS_HOST != '' }}
    steps:
      - name: Sin secretos del VPS
        if: env.TIENE_VPS != 'true'
        run: echo "Cargá VPS_HOST, VPS_USER y VPS_SSH_KEY para activar el despliegue automático."
      - name: Desplegar por SSH
        if: env.TIENE_VPS == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 15m
          script: cd /var/www/memolucas && bash scripts/desplegar.sh
