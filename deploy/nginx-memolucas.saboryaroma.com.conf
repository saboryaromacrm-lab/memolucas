# /etc/nginx/sites-available/memolucas.saboryaroma.com
# Después de copiarlo: ln -s ../sites-available/memolucas.saboryaroma.com /etc/nginx/sites-enabled/
# y `certbot --nginx -d memolucas.saboryaroma.com` para el HTTPS.
server {
    listen 80;
    server_name memolucas.saboryaroma.com;

    # Fotos que se suben desde el panel (el límite fino se configura en el panel).
    client_max_body_size 60m;

    # Actualización en vivo del panel (Server-Sent Events): sin buffer y conexión larga.
    location /api/eventos {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
